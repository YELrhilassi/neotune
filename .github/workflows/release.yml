name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-librespot:
    name: Build librespot (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: librespot
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: librespot
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: librespot
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: librespot.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev pkg-config

    - name: Build librespot (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ./librespot_src
      run: |
        cargo build --release --target ${{ matrix.target }} --no-default-features --features "pulseaudio-backend with-libmdns rustls-tls-webpki-roots"

    - name: Build librespot (macOS)
      if: matrix.os == 'macos-latest'
      working-directory: ./librespot_src
      run: |
        cargo build --release --target ${{ matrix.target }} --no-default-features --features "rodio-backend with-libmdns rustls-tls-webpki-roots"

    - name: Build librespot (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ./librespot_src
      run: |
        cargo build --release --target ${{ matrix.target }} --no-default-features --features "rodio-backend with-libmdns rustls-tls-webpki-roots"

    - name: Upload librespot artifact
      uses: actions/upload-artifact@v4
      with:
        name: librespot-${{ matrix.target }}
        path: librespot_src/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  build-python:
    name: Build Python executable
    needs: build-librespot
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: neotune
            exe_suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: neotune
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: neotune
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: neotune
            exe_suffix: ".exe"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .

    - name: Download librespot
      uses: actions/download-artifact@v4
      with:
        name: librespot-${{ matrix.target }}
        path: ./src/network/

    - name: Make librespot executable (Unix)
      if: matrix.os != 'windows-latest'
      run: chmod +x ./src/network/librespot

    - name: Rename librespot (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        move .\src\network\librespot.exe .\src\network\librespot.exe

    - name: Build executable with PyInstaller
      run: |
        pyinstaller neotune.spec --clean --noconfirm

    - name: Package application
      run: |
        mkdir -p dist/${{ matrix.target }}
        cp -r dist/neotune/* dist/${{ matrix.target }}/ || cp -r dist/neotune/* dist/${{ matrix.target }}\\ || xcopy /E /I dist\\neotune dist\\${{ matrix.target }}\\

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: neotune-${{ matrix.target }}
        path: dist/${{ matrix.target }}/

  create-release:
    name: Create Release
    needs: [build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Debug artifacts
      run: |
        echo "Contents of ./artifacts:"
        ls -la ./artifacts/
        echo ""
        echo "Looking for neotune artifacts:"
        find ./artifacts -name "neotune*" -type d 2>/dev/null || echo "No neotune directories found"
        find ./artifacts -name "neotune*" -type f 2>/dev/null || echo "No neotune files found"

    - name: Create release archives
      run: |
        mkdir -p releases
        for dir in ./artifacts/neotune-*/; do
          if [ -d "$dir" ]; then
            target=$(basename "$dir" | sed 's/neotune-//')
            echo "Processing: $dir -> $target"
            if [[ "$target" == *"windows"* ]] || [[ "$target" == *"pc-windows"* ]]; then
              (cd "$dir" && zip -r "../../releases/neotune-${target}.zip" .)
            else
              tar -czf "releases/neotune-${target}.tar.gz" -C "$dir" .
            fi
          fi
        done
        echo ""
        echo "Release archives created:"
        ls -la releases/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: releases/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
